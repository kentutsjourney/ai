<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Bot AI - Serverless Active</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #c9d1d9;
      --heading: #58a6ff;
      --accent: #238636;
      --border: #30363d;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    h1 {
      color: #f0f6fc;
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      line-height: 1.6;
      font-size: 15px;
      color: #8b949e;
      margin-bottom: 24px;
    }
    .endpoint-box {
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      color: #79c0ff;
      word-break: break-all;
      margin-bottom: 20px;
    }
    .footer {
      font-size: 12px;
      color: #6e7681;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      Serverless Online
    </div>
    <h1>🤖 Telegram Bot AI Webhook</h1>
    <p>Endpoint webhook untuk bot Telegram aktif dan siap menerima updates.</p>
    
    <div class="endpoint-box">
      POST /api/webhook
    </div>

    <div class="footer">
      Powered by grammY • Google Gemini • Supabase • Vercel
    </div>
  </div>
</body>
</html>
